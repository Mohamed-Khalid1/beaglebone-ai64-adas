# Pin the USB gadget Ethernet MAC addresses so they DO NOT randomize each boot.
#   dev_addr  = MAC of usb0 ON THE BOARD
#   host_addr = MAC the host (laptop) sees → host iface name becomes the CONSTANT
#               enxaabbcc000001 every time, making host-side config reproducible.
# Locally-administered MACs (second nibble 'a' → bit set), unicast (first nibble even).
options g_ether dev_addr=aa:bb:cc:00:00:02 host_addr=aa:bb:cc:00:00:01
